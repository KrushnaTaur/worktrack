          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 255
        employee_count:
          type: integer
          readOnly: true
    PatchedEmployee:
      type: object
      description: One serializer that reads/writes the profile and its linked user.
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
          readOnly: true
        username:
          type: string
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        full_name:
          type: string
          readOnly: true
        password:
          type: string
          writeOnly: true
        is_active:
          type: boolean
        department:
          type: integer
        department_name:
          type: string
          readOnly: true
        employee_code:
          type: string
          maxLength: 20
        job_title:
          type: string
          maxLength: 100
        phone:
          oneOf:
          - type: string
            pattern: ^\+?[0-9 \-]{7,20}$
            maxLength: 20
          - type: string
            maxLength: 0
        joined_on:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedLeaveBalance:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        user_name:
          type: string
          readOnly: true
        leave_type:
          type: integer
          readOnly: true
        leave_type_name:
          type: string
          readOnly: true
        year:
          type: integer
          readOnly: true
        total_days:
          type: integer
          maximum: 365
          minimum: 0
