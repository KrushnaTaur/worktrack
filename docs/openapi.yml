          type: string
          default: ''
          maxLength: 255
    RoleEnum:
      enum:
      - ADMIN
      - EMPLOYEE
      type: string
      description: |-
        * `ADMIN` - Admin
        * `EMPLOYEE` - Employee
    StatusEnum:
      enum:
      - PENDING
      - APPROVED
      - REJECTED
      - CANCELLED
      type: string
      description: |-
        * `PENDING` - Pending
        * `APPROVED` - Approved
        * `REJECTED` - Rejected
        * `CANCELLED` - Cancelled
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
      required:
      - email
      - first_name
      - full_name
      - id
      - last_name
      - role
      - username
